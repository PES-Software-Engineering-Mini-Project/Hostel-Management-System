
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Students</title>
</head>
<body>
    <h1>Student Records</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>SRN</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
                <tr>
                    <td>{{ student.srn }}</td>
                    <td>{{ student.user.first_name }}</td>
                    <td>{{ student.user.email }}</td>
                    <td>{{ student.phone }}</td>
                    <td>
                        <a href="{% url 'edit_student' student.id %}">
                            Edit
                        </a>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="5">No students registered yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
