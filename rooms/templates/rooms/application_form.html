
{% extends "base.html" %}

{% block title %}Apply for a Room | HMS{% endblock %}

{% block page_content %}
<main class="area-page">
  <section class="area-card">
    <h1>Apply for a Room</h1>
    <p>Submit your room preferences below. Preferences are optional.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit Application</button>
    </form>

    <p><a href="{% url 'student-dashboard' %}">Back to Dashboard</a></p>
  </section>
</main>
{% endblock %}
