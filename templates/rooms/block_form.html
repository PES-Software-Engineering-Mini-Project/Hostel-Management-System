
{% extends "base.html" %}

{% block title %}Add Block | HMS{% endblock %}

{% block page_content %}
<main class="area-page">
    <section class="area-card">
        <h1>Add Block</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Block</button>
        </form>

        <p>
            <a href="{% url 'rooms:room-list' %}">Back to Rooms</a>
        </p>
    </section>
</main>
{% endblock %}
