<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HMS receipt {{ payment.receipt_number }}</title>
    <style>
      body { color: #17233a; font-family: Arial, Helvetica, sans-serif; margin: 2rem auto; max-width: 36rem; padding: 0 1rem; }
      .receipt-header { align-items: flex-start; border-bottom: 2px solid #17233a; display: flex; justify-content: space-between; padding-bottom: 1rem; }
      .receipt-eyebrow { color: #5b6b82; font-size: .8rem; letter-spacing: .06em; margin: 0 0 .3rem; text-transform: uppercase; }
      h1 { font-size: 1.5rem; margin: 0; }
      .receipt-number { margin: 0; text-align: right; }
      .fee-summary { display: grid; gap: .5rem 1.5rem; grid-template-columns: max-content 1fr; margin: 1.25rem 0; }
      dt { color: #5b6b82; }
      dd { margin: 0; }
    </style>
  </head>
  <body>
    {% include "fees/_receipt_body.html" %}
    <p>This receipt was generated by the Hostel Management System.</p>
  </body>
</html>
